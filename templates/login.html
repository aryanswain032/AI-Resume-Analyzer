<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle at top right, #0f172a, #020617);
            color: white; font-family: 'Poppins', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 50px;
            border-radius: 24px; width: 350px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); text-align: center;
        }
        h1 { color: #14b8a6; margin-bottom: 5px; font-size: 26px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        input {
            width: 100%; box-sizing: border-box; background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 15px;
            border-radius: 12px; margin-bottom: 15px; outline: none; font-family: 'Poppins';
        }
        input:focus { border-color: #14b8a6; }
        .btn {
            width: 100%; padding: 15px; background: #14b8a6; color: #020617;
            border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: 0.3s; box-shadow: 0 0 15px rgba(20, 184, 166, 0.4);
        }
        .btn:hover { background: #0d9488; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1>Student Portal</h1>
        <p>Login to access the AI Resume Analyzer</p>
        
        <!-- This form sends a POST request to our /login route -->
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Username (e.g., admin)" required>
            <input type="password" name="password" placeholder="Password (e.g., 1234)" required>
            <button type="submit" class="btn">Login 🚀</button>
        </form>
    </div>
</body>
</html>
